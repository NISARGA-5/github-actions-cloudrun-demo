name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker Image
        run: |
          docker build -t us-central1-docker.pkg.dev/project1-494202/my-repo/node-app:latest .

      - name: Push Docker Image
        run: |
          docker push us-central1-docker.pkg.dev/project1-494202/my-repo/node-app:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy node-app \
            --image us-central1-docker.pkg.dev/project1-494202/my-repo/node-app:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated